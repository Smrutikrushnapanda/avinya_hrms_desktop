appId: com.avinya.hrms.desktop
productName: Avinya HRMS Monitor
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/App-logo.png
    to: App-logo.png
asarUnpack:
  - '**/node_modules/uiohook-napi/**'
  - '**/node_modules/get-windows/**'
afterPack: scripts/afterPack.js
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
publish: null
